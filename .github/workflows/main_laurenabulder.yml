# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - laurenabulder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # NEXT_PUBLIC_* vars are baked into the bundle at build time
          NEXT_PUBLIC_MAIN_DOMAIN_URL: https://laurenastudio.pro
          # Suppress non-critical Next.js telemetry
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prune dev dependencies before packaging
        run: npm prune --production

      - name: Create node_modules tarball (Azure startup script uses this format)
        run: tar -czf node_modules.tar.gz -C node_modules .

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "src/*" \
            --exclude "scaffold/*" \
            --exclude "laurenabulder_logs*" \
            --exclude "*.zip" \
            --exclude "scripts/*" \
            --exclude "node_modules/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB7CC747A5294551AD5D9CCF91E1910E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1D44A814C30A4F7D8A4545957CE6E812 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F617754574FF4D90BEF7139899A0C683 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'laurenabulder'
          slot-name: 'Production'
          package: deploy.zip
